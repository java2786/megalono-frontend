name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main # Triggers only when code hits main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build:prod # Ensure this script exists in your package.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/arun_kumar_profile/browser # Update with your project name
          branch: gh-pages
          clean: true
