name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses that name

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify the Node version matching your development environment
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build:prod

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/arun_kumar_profile/browser # Path to the compiled production assets
          branch: gh-pages # The target branch the action will create/update
          clean: true # Automatically remove obsolete files from the deployment branch
