<header class="main-header" style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 3rem; border-bottom: 1px solid var(--border-color); background: var(--bg-surface);">
  <div class="logo-area" style="font-weight: 700; color: var(--text-main);">
    AK <span style="opacity: 0.5; font-weight: 400;">// Systems Consultant</span>
  </div>
  <nav style="display: flex; gap: 2rem;">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" style="text-decoration: none; color: var(--text-main); font-weight: 500;">Overview</a>
    <a routerLink="/cases" routerLinkActive="active" style="text-decoration: none; color: var(--text-main); font-weight: 500;">Architecture Labs</a>
    <a routerLink="/videos" routerLinkActive="active" style="text-decoration: none; color: var(--text-main); font-weight: 500;">Workshops</a>
  </nav>
  <button (click)="toggleTheme()" style="padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-main); font-weight: 600; cursor: pointer;">
    {{ isDark ? '☀️ Light View' : '🌙 Dark View' }}
  </button>
</header>

<!-- Dynamic Content Engine Insertion Point -->
<main style="min-height: calc(100vh - 180px);">
  <router-outlet></router-outlet>
</main>

<!-- Unified Profile Network Footer Framework -->
<footer style="border-top: 1px solid var(--border-color); background: var(--bg-surface); padding: 3rem 1.5rem; margin-top: 4rem; text-align: center;">
  <p style="margin: 0 0 1.5rem 0; font-size: 0.95rem; opacity: 0.8; font-family: system-ui, sans-serif;">
    Explore my verified project implementations, production code bases, and consultancy availability:
  </p>
  
  <div style="display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap;">
    <a href="https://linkedin.com/in/your-profile" target="_blank" style="padding: 0.5rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--accent-color); text-decoration: none;">LinkedIn</a>
    <a href="https://github.com/your-username" target="_blank" style="padding: 0.5rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--accent-color); text-decoration: none;">GitHub</a>
    <a href="https://toptal.com/resume/your-profile" target="_blank" style="padding: 0.5rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--accent-color); text-decoration: none;">Toptal</a>
    <a href="https://upwork.com/freelancers/your-id" target="_blank" style="padding: 0.5rem 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--accent-color); text-decoration: none;">Upwork</a>
  </div>
  
  <p style="margin-top: 2rem; font-size: 0.75rem; opacity: 0.5;">
    © 2026 Arun Kumar. Built with Angular Zoneless Architecture.
  </p>
</footer>
