<header class="main-header" style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 3rem; border-bottom: 1px solid var(--border-color); background: var(--bg-surface);">
  <div class="logo-area" style="font-weight: 700; color: var(--text-main);">
    AK <span style="opacity: 0.5; font-weight: 400;">// Systems Consultant</span>
  </div>
  <nav style="display: flex; gap: 2rem;">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" style="text-decoration: none; color: var(--text-main); font-weight: 500;">Overview</a>
    <a routerLink="/cases" routerLinkActive="active" style="text-decoration: none; color: var(--text-main); font-weight: 500;">Architecture Labs</a>
    <a routerLink="/videos" routerLinkActive="active" style="text-decoration: none; color: var(--text-main); font-weight: 500;">Workshops</a>
  </nav>
  <button (click)="toggleTheme()" style="padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-main); font-weight: 600; cursor: pointer;">
    {{ isDark ? '☀️ Light View' : '🌙 Dark View' }}
  </button>
</header>

<!-- Dynamic Content Engine Insertion Point -->
<main style="min-height: calc(100vh - 180px);">
  <router-outlet></router-outlet>
</main>

<!-- Unified Profile Network Footer Framework -->
<footer class="main-footer">
  <div class="footer-container">
    <div class="footer-grid">
      
      <!-- Column 1: Consulting Expertise -->
      <div class="footer-col">
        <h3 class="footer-heading">Consulting Expertise</h3>
        <ul class="footer-list">
          <li class="footer-list-item" *ngFor="let item of consultingExpertise">
             {{ item.title }} 
          </li>
        </ul>
      </div>

      <!-- Column 2: Connect -->
      <div class="footer-col">
        <h3 class="footer-heading">PROFESSIONAL PROFILES</h3>
        <div class="footer-social-links">
          <a href="https://linkedin.com/in/your-profile" target="_blank" class="footer-social-link">LinkedIn</a>
          <a href="https://github.com/your-username" target="_blank" class="footer-social-link">GitHub</a>
          <a href="https://toptal.com/resume/your-profile" target="_blank" class="footer-social-link">Toptal</a>
          <a href="https://upwork.com/freelancers/your-id" target="_blank" class="footer-social-link">Upwork</a>
        </div>
      </div>

      <!-- Column 3: About -->
      <div class="footer-col">
        <h3 class="footer-heading">About</h3>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <p class="footer-about-brand">Megalono</p>
          <p class="footer-about-subtitle">Enterprise Engineering Platform</p>
          <p class="footer-about-details" style="margin-top: 0.5rem;">
            Designed & Engineered by Arun Kumar<br>
            Delhi NCR, India
          </p>
          <p class="footer-about-copyright">© {{ today.getFullYear() }}</p>
        </div>
      </div>

    </div>
  </div>
</footer>
